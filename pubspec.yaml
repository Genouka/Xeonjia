name: xeonjia
description: Solve ice puzzles and defeat enemies in an RPG world.

version: 2.1.2+10

environment:
  sdk: ">=2.11.0 <3.0.0"
  flutter: ^2.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  device_info_plus: ^3.1.1
  flame: ^0.29.4
  i18n_extension: ^4.0.0
  shared_preferences: ^2.0.9
  url_launcher: ^6.0.17
  xml: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/graphics/
    - assets/images/
    - assets/images/heads/
    - assets/maps/
    - assets/maps/arena/
    - assets/maps/story/
    - assets/maps/tilesets/
    - assets/maps/utils/

  fonts:
    - family: dd5x7
      fonts:
        - asset: assets/fonts/dd5x7.ttf
    - family: kobi
      fonts:
        - asset: assets/fonts/kobi-linear.ttf

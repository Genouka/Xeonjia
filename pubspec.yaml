name: xeonjia
description: Solve ice puzzles and defeat enemies in an RPG world.

version: 2.0.1+7

environment:
  sdk: ">=2.10.0 <3.0.0"
  flutter: ^1.22.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flame: ^0.28.0
  i18n_extension: ^1.4.5
  shared_preferences: ^0.5.12+4
  url_launcher: ^5.7.10
  xml: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  pedantic: ^1.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/graphics/
    - assets/images/
    - assets/images/heads/
    - assets/maps/
    - assets/maps/arena/
    - assets/maps/story/
    - assets/maps/tilesets/

  fonts:
    - family: m5x7
      fonts:
        - asset: assets/fonts/m5x7.ttf
name: xeonjia
description: Save the world by solving ice puzzles and defeating enemies.

version: 2.2.1+12

environment:
  sdk: ">=2.18.2 <3.0.0"
  flutter: ^3.3.6

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  animated_background: ^2.0.0
  archive: ^3.3.2
  collection: ^1.16.0
  device_info_plus: ^8.0.0
  flame: ^1.4.0
  flame_audio: ^1.3.2
  i18n_extension: ^5.0.1
  meta: ^1.8.0
  path: ^1.8.2
  shared_preferences: ^2.0.15
  url_launcher: ^6.1.6
  xml: ^6.1.0

dev_dependencies:
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/data/
    - assets/graphics/
    - assets/images/
    - assets/images/metadata/
    - assets/maps/
    - assets/maps/arena/
    - assets/maps/story/
    - assets/maps/tilesets/
    - locale/be/LC_MESSAGES/
    - locale/bn/LC_MESSAGES/
    - locale/de/LC_MESSAGES/
    - locale/es/LC_MESSAGES/
    - locale/fr/LC_MESSAGES/
    - locale/hu/LC_MESSAGES/
    - locale/id/LC_MESSAGES/
    - locale/it/LC_MESSAGES/
    - locale/ja/LC_MESSAGES/
    - locale/ru/LC_MESSAGES/
    - locale/tr/LC_MESSAGES/
    - locale/uk/LC_MESSAGES/
    - locale/vi/LC_MESSAGES/
    - locale/zh-Hans/LC_MESSAGES/

  fonts:
    - family: dd5x7
      fonts:
        - asset: assets/fonts/dd5x7.ttf
    - family: LanaPixel
      fonts:
        - asset: assets/fonts/LanaPixel.ttf
    - family: kobi
      fonts:
        - asset: assets/fonts/kobi-linear.ttf

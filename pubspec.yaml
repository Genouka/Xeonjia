name: xeonjia
description: Solve ice puzzles and defeat enemies in an RPG world.

version: 2.2.1+12

environment:
  sdk: ">=2.17.1 <3.0.0"
  flutter: ^3.0.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  collection: ^1.16.0
  device_info_plus: ^3.2.4
  flame: ^1.2.0
  flame_audio: ^1.1.0
  i18n_extension: ^5.0.0
  meta: ^1.7.0
  path: ^1.8.1
  shared_preferences: ^2.0.15
  url_launcher: ^6.1.3
  xml: ^6.1.0

dev_dependencies:
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/graphics/
    - assets/images/
    - assets/images/heads/
    - assets/maps/
    - assets/maps/arena/
    - assets/maps/story/
    - assets/maps/tilesets/
    - assets/maps/utils/

  fonts:
    - family: dd5x7
      fonts:
        - asset: assets/fonts/dd5x7.ttf
    - family: kobi
      fonts:
        - asset: assets/fonts/kobi-linear.ttf

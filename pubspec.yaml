name: xeonjia
description: Solve ice puzzles and defeat enemies in an RPG world.

version: 1.2.0+5

environment:
  sdk: ">=2.9.0 <3.0.0"
  flutter: ^1.20.3

dependencies:
  flutter:
    sdk: flutter
  flame: ^0.26.0
  url_launcher: ^5.5.2
  shared_preferences: ^0.5.10
  xml: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pedantic: ^1.8.0+1

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/data.json
    - assets/images/
    - assets/maps/
    - assets/maps/arena/
    - assets/maps/story/

  fonts:
    - family: m5x7
      fonts:
        - asset: assets/fonts/m5x7.ttf
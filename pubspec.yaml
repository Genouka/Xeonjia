name: xeonjia
description: Solve ice puzzles and defeat enemies in an RPG world.

version: 1.0.1+2

environment:
  sdk: ">=2.2.2 <3.0.0"
  flutter: ^1.9.1+hotfix.4

dependencies:
  flutter:
    sdk: flutter
  flame: ^0.16.1
  url_launcher: ^5.2.5
  shared_preferences: ^0.5.4+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  pedantic: ^1.8.0+1

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/maps/
    - assets/maps/arena/
name: xeonjia
description: Solve ice puzzles and defeat enemies in an RPG world.

version: 2.1.1+9

environment:
  sdk: ">=2.11.0 <3.0.0"
  flutter: ^2.2.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flame: ^0.29.4
  i18n_extension: ^4.0.0
  shared_preferences: ^2.0.5
  url_launcher: ^6.0.4
  xml: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  pedantic: ^1.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/bgm/
    - assets/audio/sfx/
    - assets/graphics/
    - assets/images/
    - assets/images/heads/
    - assets/maps/
    - assets/maps/arena/
    - assets/maps/story/
    - assets/maps/tilesets/

  fonts:
    - family: dd5x7
      fonts:
        - asset: assets/fonts/dd5x7.ttf
    - family: kobi
      fonts:
        - asset: assets/fonts/kobi-linear.ttf

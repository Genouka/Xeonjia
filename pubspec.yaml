name: xeonjia
description: Solve ice puzzles and defeat enemies in an RPG world.

version: 1.0.1+2

environment:
  sdk: ">=2.6.0 <3.0.0"
  flutter: ^1.12.13+hotfix.8

dependencies:
  flutter:
    sdk: flutter
  flame: ^0.18.1
  url_launcher: ^5.4.2
  shared_preferences: ^0.5.6+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  pedantic: ^1.8.0+1

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/maps/
    - assets/maps/arena/
